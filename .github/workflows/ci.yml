name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 缓存与工作目录不在同一文件系统时，硬链接会失败并刷一屏警告
  UV_LINK_MODE: copy

jobs:
  # ── 计划书 §12.3：单元测试 ────────────────────────────────────────────────
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 不在矩阵里：root 工程的 requires-python 是 >=3.11（SpikingJelly
        # 2.0.0rc1 的下限，见 ADR-0008）。骨架库自己的 >=3.10 声明改由下面的
        # package job 用 3.10 腿覆盖——那里装的是 wheel，不是源码树。
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: 跑测试（骨架库与仓库工具链，全 CPU、无 torch）
        # 刻意写出路径而不是光跑 pytest：testpaths 里还有 research/，而那部分
        # 需要 torch，由下面的 research-smoke job 负责（装 CPU 版 torch）。
        # 这样两个 job 各自跑自己能跑的那半，谁都不必假装另一个不存在。
        run: uv run pytest -q packages/biosnn-bus/tests tests

  # ── 计划书 §七 第一阶段：研究代码的 CPU 冒烟测试 ──────────────────────────
  # 三条验证线（IB-Hebbian / e-prop / R-STDP）的验收实验在本机 GPU 上跑，
  # 这里只跑缩小规模、能在 CPU 上快速跑完的那部分：张量形状、学习规则的
  # 局部性断言、种子可复现性，以及 examples/paper_*.py 的冒烟模式。
  #
  # torch 走 CPU 索引（pyproject.toml 的 [[tool.uv.index]]，按平台换源），
  # 所以这个 job 不会拖下几百 MB 的 CUDA 轮子。
  research-smoke:
    name: research 冒烟测试（CPU）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group research
      - name: 跑 research 测试（跳过标了 gpu / slow 的）
        # 注意：**目前没有任何测试带这两个标记**，所以这个过滤器眼下是空操作——它守的是
        # 「将来有人加 GPU / 慢测试」，不是当前状态。标记本身在 pyproject 的 markers 里声明过，
        # `--strict-markers` 会把拼错标记的测试直接判失败。
        run: uv run pytest -q research -m "not gpu and not slow"
      - name: 跑每条验证线的最小复现脚本（冒烟模式）
        run: |
          for script in examples/paper_*.py; do
            echo "── $script"
            uv run python "$script"
          done
      - name: 下载 MNIST（验收脚本的冒烟模式要用，约 10 MB）
        run: uv run python scripts/download_data.py mnist
      - name: 跑验收脚本的冒烟模式
        # 这两条只证明"整条训练路径能执行"——冒烟规模下的精度没有意义，
        # 它们在 main() 里被显式豁免了验收判定。正确性由单元测试承担。
        run: |
          uv run python -m research.ib_hebbian.train_mnist --smoke
          uv run python -m research.eprop.train_sequential --smoke
          uv run python -m research.rstdp.cartpole --smoke
      - name: 骨架库的 torch 桥接测试（本地装了 torch 才会跑）
        # 这几条在 test job 里因为没装 torch 而被 importorskip 跳过；
        # 这里补上真正跑一遍——from_torch 的内存别名 bug 就是这么漏掉的。
        run: uv run pytest -q packages/biosnn-bus/tests/test_types.py -k torch

  # ── 计划书 §12.3：风格 ────────────────────────────────────────────────────
  lint:
    name: ruff（check + format）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  # ── 计划书 §12.3：文档代码块语法检查 ──────────────────────────────────────
  # 拦 self.threshold 这类未定义引用。它会真的执行文档里的代码块——纯语法检查
  # 抓不到属性拼写错误。无法独立运行的片段必须在围栏上显式标注 `python no-run`。
  doc-code-blocks:
    name: 文档代码块检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_doc_code_blocks.py
      # notebook 是由 .py 生成的（见 .pre-commit-config.yaml 的同名钩子）。这里再校验一次：
      # 改了 examples/*.py 却忘了重建 notebook，CI 要红——否则本地钩子被绕过就没人拦。
      - run: uv run python scripts/build_notebook.py --check

  # ── 计划书 §12.3：版本号一致性检查 ────────────────────────────────────────
  version-consistency:
    name: 版本号一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_version_consistency.py

  # ── 计划书 §12.3：引用清单结构检查（不联网）───────────────────────────────
  references:
    name: 引用清单检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_references.py

  # ── Markdown 表格结构检查（不联网）────────────────────────────────────────
  # GFM 里表格的 `|` **即使在反引号内也仍是列分隔符**，要写成 `\|` 才是字面竖线。
  # 漏转义会让该行多出单元格，而渲染时超出表头格数的部分**被直接丢弃**——文件里还在，
  # 渲染出来却没有。这类错误读原文发现不了：cat 正常、git diff 正常、逐行审查也正常。
  # 2026-09-25 因此在引用清单里静默丢过 877 个字符（见 docs/references.md 的
  # 「已发生过的错误」一节），所以补上这道检查。
  md-tables:
    name: Markdown 表格结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_md_tables.py

  # ── 三语一致性检查 ────────────────────────────────────────────────────────
  # 文档有中文 / English / 日本語 三版。最大的风险不是"翻译得不好"，而是
  # **改了一处忘了另两处**——漂移的译文比没有译文更误导人，读者会以为读到的是
  # 当前状态。这个 job 拦四类漂移：漏译、标题结构错位、代码块被改坏、
  # 内部链接指回别的语言。
  translations:
    name: 三语一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_translations.py

  # ── 计划书 §12.3：引用链接存活检查 ────────────────────────────────────────
  # 这是拦截"Khacef 署名"那类错误的入口：错误 DOI 与死链会在这里暴露。
  links:
    name: 引用链接存活检查（lychee）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403 也放行：ACM DL / Nature / IEEE 会对自动化检查返回 403，
          # 那说明"服务器拒绝了我们"，而不是"链接是错的"。真正的 404 仍然会失败。
          #
          # 唯一一条 URL 级排除：`https://doi.org/10.1613/jair.3912`。它是全仓唯一一处
          # "引用他人原文里的 DOI"——出现在 research/eprop/README.{md,en,ja} 的逐字引用块
          # （e-prop 论文 Data availability 原文）里，不是本仓库主张的链接。
          # doi.org → jair.org 对 lychee 稳定返回 "HTTP/2 protocol error. Server may not
          # support HTTP/2 properly"（同一段引用里的 NIST DOI 正常通过），连续两次重跑
          # 复现，不是抖动。已手工核实链接本身是活的：curl -L 跟随重定向得 200，终点
          # https://jair.org/index.php/jair/article/view/10819 —— 是检查器的传输层问题，
          # 不是死链。只排除这一个 URL，不排除域名：jair.org 上的其他链接仍会被检查。
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429,403
            --exclude '^https://doi\.org/10\.1613/jair\.3912$'
            --exclude-path .venv
            --exclude-path node_modules
            './**/*.md'
          fail: true

  # ── 计划书 §12.1：第三方依赖许可审计 ──────────────────────────────────────
  # 计划书点名要核查 eprop-PyTorch 与 Lava/Loihi 相关组件的许可证条款。
  # 这里只做基线：列出全部依赖的许可证，并在出现强 copyleft 时失败。
  license-audit:
    name: 依赖许可审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group research
      - name: 导出依赖许可证清单
        # 必须带上 --group research：不带的话 torch / SpikingJelly / gymnasium
        # 根本不进环境，审计报告里没有它们，等于没审。
        run: |
          uv run --with pip-licenses pip-licenses --format=json > licenses.json
          uv run --with pip-licenses pip-licenses --format=markdown --with-urls > dependency-licenses.md
          cat dependency-licenses.md
      - name: 拒绝强 copyleft 依赖，并要求许可证不明的依赖被显式登记
        # 用脚本而不是内联 grep。第一版是内联的
        #   grep -Ei '\| *(A?GPL|SSPL|BUSL)' dependency-licenses.md
        # 它在首次 CI 运行时就误报了：--with-license-file 会把许可证**正文**整段灌进
        # 表格，而 PSF 许可证正文里有一句 "GPL-compatible licenses make it possible
        # to combine Python with ..."，整行 grep 直接命中。
        # 纯文本 grep 分不清"许可证名称"与"正文里提到 GPL"。脚本只比对名称字段，
        # 而且能本地跑——这一条本地跑一次就能发现，不该由 CI 来发现。
        #
        # --strict-unknown 是后加的：按前缀比对认不出**没有名字**的许可证。
        # SpikingJelly 的 License 字段是空的，于是它落进 unknown 桶，而 unknown
        # 默认只打印不失败——它的 OIOSL 1.0（非 Apache-2.0）就这样一路静默通过。
        # 现在要放行必须在脚本的 ACCEPTED_NON_STANDARD 里登记并写明理由。
        run: uv run python scripts/check_licenses.py licenses.json --strict-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: |
            dependency-licenses.md
            licenses.json

  # ── 计划书 §七 第零阶段成功标准：「骨架库可 pip install」 ─────────────────
  package:
    name: 构建 wheel 并在干净环境安装（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 骨架库自己的 requires-python 是 >=3.10，与 root 工程的 >=3.11 无关
        # （root 那个下限是 SpikingJelly 逼出来的，见 ADR-0008）。3.10 这一腿
        # 就是那句对外声明的实际覆盖——没有它，改 root 下限会把这句话一起架空。
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 刻意不跑 uv sync：root 的 requires-python 是 >=3.11，在 3.10 腿上同步会失败，
      # 而构建 wheel 本来就不需要同步过的环境。
      - run: uv build --package biosnn-bus --out-dir dist
      - name: 在全新 venv 里安装并导入（证明对外可用）
        run: |
          uv venv /tmp/clean --python ${{ matrix.python-version }}
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "
          import biosnn_bus
          from biosnn_bus import ModalityPlugin, SpikeBus, SpikeTrain
          from biosnn_bus.plugins import DiffImagePlugin
          print('biosnn-bus', biosnn_bus.__version__, 'OK')
          "
      - name: 确认 wheel 没有把 torch 拖成依赖
        run: |
          /tmp/clean/bin/python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('torch') is None, '骨架库不应依赖 torch（见 ADR-0002）'
          print('未安装 torch，符合预期')
          "
      - name: 在干净环境里跑骨架库测试套件
        # 这一段才是 3.10 腿存在的理由。装的是 wheel 而非源码树，所以验证的是
        # 分发包本身在 3.10 上可用。这里没有 torch，于是 torch 桥接那几条被
        # importorskip 跳过、而 test_helpful_error_without_torch 被执行；
        # research-smoke job 里则是反过来。两条路径互补，合起来才算覆盖完整。
        run: |
          uv pip install --python /tmp/clean/bin/python pytest
          PYTHONPATH="$PWD/packages/biosnn-bus/tests" \
            /tmp/clean/bin/python -m pytest -q packages/biosnn-bus/tests
      - uses: actions/upload-artifact@v4
        with:
          name: biosnn-bus-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
