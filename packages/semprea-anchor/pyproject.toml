[project]
name = "semprea-anchor"
version = "1.0.0"
description = "Semprea-Anchor：人格与记忆核的可分发外壳（模型与人格随包，不绑定宿主程序）"
requires-python = ">=3.10"
# 核心包本身不依赖任何东西：`uv sync` 不该为了一个可分发外壳把 torch 装进每个 CI 腿。
dependencies = []

# 真正跑起来需要 transformers / torch，但**不写进依赖**：这是随包的独立分发物
# （`pack.py` 打，不走 PyPI），把 torch 写进 workspace 的解析会把整棵依赖树拖进 uv.lock，
# 而每个 CI 腿都要为它付一次 `uv sync`。见 README 的安装说明。

[project.scripts]
semprea-anchor = "semprea_anchor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semprea_anchor"]
