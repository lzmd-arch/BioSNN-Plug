[project]
name = "persona-core"
version = "0.1.0"
description = "通用的人格与记忆核：权重外的记忆库初始化与打包清单（不绑定宿主程序）"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
persona-core = "persona_core.init_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_core"]
