[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biosnn-mcp"
version = "0.2.0"
description = "BioSNN-Plug 阶段五 MCP 服务器：4 个只读工具 + 5 个提议工具（propose.*，只改内存替身核），默认只读、逐调用 JSONL 审计，不依赖 LLM"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "离中梦蝶", email = "269058959+lzmd-arch@users.noreply.github.com" }]
keywords = ["mcp", "spiking-neural-network", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
biosnn-mcp = "biosnn_mcp.server:main"

[project.urls]
Homepage = "https://github.com/lzmd-arch/BioSNN-Plug"
Repository = "https://github.com/lzmd-arch/BioSNN-Plug"

[tool.hatch.build.targets.wheel]
packages = ["src/biosnn_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]
