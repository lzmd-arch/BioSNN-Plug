[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biosnn-mcp"
version = "0.3.0"
description = "BioSNN-Plug 阶段五 MCP 服务器：只读版（biosnn-mcp）与提议队列写版（biosnn-mcp-write，提议经门控落库、可回滚、全程 JSONL 审计），不依赖 LLM"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "离中梦蝶", email = "269058959+lzmd-arch@users.noreply.github.com" }]
keywords = ["mcp", "spiking-neural-network", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
biosnn-mcp = "biosnn_mcp.server:main"
biosnn-mcp-write = "biosnn_mcp.server:main_write"

[project.urls]
Homepage = "https://github.com/lzmd-arch/BioSNN-Plug"
Repository = "https://github.com/lzmd-arch/BioSNN-Plug"

[tool.hatch.build.targets.wheel]
packages = ["src/biosnn_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]
